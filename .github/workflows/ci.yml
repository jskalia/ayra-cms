name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholder so the config loads during the CI build. Not used anywhere else;
      # real secrets live only in Vercel and .env.local.
      PAYLOAD_SECRET: ci-build-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  isolation-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ayra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI database and placeholder secret; nothing real is used here.
      DATABASE_URL: postgres://postgres:ci-only@localhost:5432/ayra_test
      PAYLOAD_SECRET: ci-build-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
